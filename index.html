<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="tytul-strony">Philipsmaxxxxxing </title>
    <link href="https://fonts.cdnfonts.com/css/philips-display" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="pojemnik">
        <div class="wybor-jezyka-kontener">
            <select id="wybor-jezyka" class="wybor-jezyka">

            </select>
        </div>

        <div class="text-box">
        <span>P</span>
        <span>H</span>
        <span>I</span>
        <span>L</span>
        <span>I</span>
        <span>P</span>
        <span>S</span>
        </div>
        <h1 id="tytul">phace Philips</h1>

        <div id="status" class="wiadomosc status-oczekujaca">
           loading Gerard
        </div>
        
        <div class="kompas-kontener">
            <div id="kompas" class="kompas">
                <div class="igla igla-kaaba" id="igla-kaaba"></div>
            </div>
        </div>
        
        <div class="informacje">
            <p><span id="akt-lokalizacja">your location:</span> <span id="dane-lokalizacji">Szukanie...</span></p>
            
            <p><span id="etykieta-dystans">distance:</span> <span id="dane-dystansu">---</span></p>
            
            <p><span id="kierunek-kaaby">Philips direction:</span> <span id="kat-kaaby">---</span></p>
            
            <p id="info-orientacja" class="wskazowka">loading compass.......</p>
        </div>

    </main>

    <script src="app.js"></script>

</html>
